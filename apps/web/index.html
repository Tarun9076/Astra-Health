<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a1120" />
    <meta name="apple-mobile-web-app-title" content="ASTRA HEALTH" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASTRA HEALTH</title>
    <script>
      // theme before the first paint (src/lib/theme.ts): the stored choice, else the device setting
      try {
        var t = localStorage.getItem('astra-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
